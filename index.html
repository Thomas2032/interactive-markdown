<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interactive Markdown</title>
    <link rel="stylesheet" href="styles/app.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <h1>Interactive Markdown</h1>
        <span>Editor + live IVM preview</span>
      </div>
      <div class="toolbar">
        <button type="button" id="btn-open">Open…</button>
        <button type="button" id="btn-save" class="primary">Save .md</button>
        <button type="button" id="btn-clear">Reset</button>
        <select id="example-select" aria-label="Load example">
          <option value="">Examples…</option>
          <option value="amplitude.md">amplitude.md</option>
          <option value="circular-motion.md">circular-motion.md</option>
          <option value="agent-loop.md">agent-loop.md</option>
          <option value="graph.md">graph.md</option>
          <option value="normal-density.md">normal-density.md</option>
          <option value="p0-demo.md">p0-demo.md</option>
          <option value="p1-demo.md">p1-demo.md</option>
          <option value="p1-diagnostics-demo.md">p1-diagnostics-demo.md</option>
          <option value="p2-layout-data-demo.md">p2-layout-data-demo.md</option>
          <option value="p2-p3-demo.md">p2-p3-demo.md</option>
          <option value="p4-demo.md">p4-demo.md</option>
          <option value="p3-p4-demo.md">p3-p4-demo.md</option>
        </select>
        <input id="file-input" type="file" accept=".md,text/markdown,text/plain" />
      </div>
      <div id="status">Loading…</div>
    </header>

    <main class="layout">
      <section class="pane" aria-label="Editor">
        <div class="pane-title">Source</div>
        <textarea id="editor" spellcheck="false" aria-label="Markdown source"></textarea>
      </section>
      <section class="pane" aria-label="Preview">
        <div class="pane-title">Preview</div>
        <div id="preview"></div>
      </section>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
